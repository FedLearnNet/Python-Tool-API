[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages]
find = { include = ["pyfedappwrap*"], exclude = ["data*", "__pycache__*", "test.py", "main.py"] }

[tool.setuptools.package-data]
"pyfedappwrap.engine.tests.federated" = ["*.yml"]

[project]
name = "pyfedappwrap"
version = "0.7.12"
description = "Wrapper for local FL-Net App development, !!DO NOT CHANGE VERSION WITHOUT PERMISSION!!!"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Simon Süwer", email = "simon.suewer@uni-hamburg.de"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["fl", "feddb", "python"]
dependencies = [
    "websockets~=15.0.1",
    "pydantic-yaml==1.3.0",
    "PyYAML~=6.0.2",
    "watchdog~=5.0.3",
    "pydantic~=2.9.2",
    "psutil~=6.1.0",
    "pydantic-settings~=2.6.0",
    "pydantic_yaml~=1.3.0",
    "requests~=2.32.3",
     "numpy>=1.23.5,<3",
    "pandas>=1.5.3,<3",
    "validators~=0.35.0",
]

[project.urls]
"Homepage" = "https://gitlab.cosy.bio/cosybio/federated-learning/federated_db/pyfedappwrap"
"Bug Tracker" = "https://gitlab.cosy.bio/cosybio/federated-learning/federated_db/pyfedappwrap/-/issues"
