[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["pyfedappwrap*"] }

[tool.setuptools.package-data]
"pyfedappwrap.engine.tests.federated" = ["*.yml"]

[project]
name = "FL-Net-Python-Tool-API"
version = "0.7.13" # Maintainers only: do not change the version without permission, it triggers publishing and the Docker base images
description = "Python SDK and runtime for building FL-Net tools: local analyses, preprocessing, exports and federated learning apps"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Simon Süwer", email = "simon.suewer@uni-hamburg.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["federated learning", "fl-net", "privacy", "smpc", "differential privacy", "sdk"]
dependencies = [
    "websockets~=17.1",
    "pydantic-yaml~=1.7",
    "PyYAML~=6.0",
    "watchdog~=6.0",
    "pydantic~=2.13",
    "psutil~=7.0",
    "pydantic-settings~=2.15",
    "requests~=2.34",
    "numpy>=1.26.4,<3",
    "pandas>=2.2,<3",
    "validators~=0.35.0",
]

[project.optional-dependencies]
# PNG/JPEG output in the random image generator; without Pillow it writes PPM files
images = ["Pillow"]
test = ["pytest", "typing_extensions"]
dev = ["FL-Net-Python-Tool-API[test,images]"]

[project.urls]
Homepage = "https://github.com/FedLearnNet/Python-Tool-API"
Documentation = "https://federated-learning.net/documentation/"
Source = "https://github.com/FedLearnNet/Python-Tool-API"
Issues = "https://github.com/FedLearnNet/Python-Tool-API/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
