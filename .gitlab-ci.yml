  script:
    - export BASE_IMAGE="$(sh ci/resolve_base_image.sh base-python "${PYFEDAPPWRAP_VERSION}" "1" "${CI_REGISTRY_IMAGE}")"
    - echo "Using BASE_IMAGE=${BASE_IMAGE}"
