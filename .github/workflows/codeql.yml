name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  workflow_dispatch:
  # Weekly analysis, also picks up newly released CodeQL queries. Disabled for now: uncomment to enable.
  # schedule:
  #   - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # python: application code, actions: the workflows in .github/workflows
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # Findings appear under Security → Code scanning and as pull request annotations
      - uses: github/codeql-action/analyze@v4.38.0
        with:
          category: /language:${{ matrix.language }}
