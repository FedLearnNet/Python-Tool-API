name: Container scan

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to scan (latest or a pyfedappwrap version)
        type: string
        default: latest
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Weekly scan of the published images
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/fedlearnnet/python-tool-api
  # Scheduled runs have no inputs and scan latest
  TAG: ${{ inputs.tag || 'latest' }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [base-python, base-python-dep, base-r, base-r-dep, base-r-biocmanager, base-r-dep-biocmanager]
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }}:${{ env.TAG }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true

      # Findings appear under Security → Code scanning
      - uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
