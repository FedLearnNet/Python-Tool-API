name: Publish package

# develop -> TestPyPI plus base images tagged X.Y.Z.dev and staging, main -> PyPI
on:
  push:
    branches: [main, develop]
    paths:
      - "pyfedappwrap/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Version from pyproject.toml, checked against the branch, see FedLearnNet/.github/actions/version
  version:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        uses: FedLearnNet/.github/actions/version@main
      # Package indexes never take a version twice, so each X.Y.Z.dev build is uploaded as X.Y.Z.dev<run>.
      # The repository and the image tags keep X.Y.Z.dev.
      - id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *.dev) echo "version=$VERSION$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=$VERSION" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
        run: bash .github/scripts/version.sh set "$PACKAGE_VERSION"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Separate jobs so only the upload step gets the OIDC token.
  # Trusted publishing: (Test)PyPI trusts this workflow and environment, no API token needed.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/FL-Net-Python-Tool-API/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      # A rerun of the same run has the same package version, which is skipped
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/FL-Net-Python-Tool-API/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true

  # All base images with the develop SDK, so tools try it before a release
  docker-develop:
    name: Develop base images
    needs: [version, publish-testpypi]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package-version: ${{ needs.version.outputs.package_version }}
      testpypi: true
    permissions:
      contents: read
      packages: write
      security-events: write
