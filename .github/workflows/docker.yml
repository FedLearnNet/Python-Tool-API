name: Docker base images

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "docker/Dockerfile.base-chainguard"
      - "docker/Dockerfile.base-r-chainguard"
      - "docker/Dockerfile.base-r-cluster-chainguard"
      - "docker/docker-entrypoint.sh"
      - "docker/Dockerfile.code-transformer-runtime"
      - "code-transformer-runtime/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the images for this version already exist
        type: boolean
        default: false
  # Develop images: publish.yml calls this from develop after it put the SDK on TestPyPI
  workflow_call:
    inputs:
      version:
        description: Image tag, the X.Y.Z.dev version of the repository
        type: string
        required: true
      package-version:
        description: Version of pyfedappwrap the images install, X.Y.Z.dev<run> on TestPyPI
        type: string
        required: true
      testpypi:
        type: boolean
        default: false

concurrency:
  group: docker-base-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/python-tool-api
  PYTHON_VERSION: "3.11"
  IMAGES: base-python base-python-dep base-r base-r-dep base-r-biocmanager base-r-dep-biocmanager code-transformer-runtime
  # Develop images take pyfedappwrap from TestPyPI and move staging instead of latest, like the other FL-Net images
  PYPI_JSON: ${{ inputs.testpypi && 'https://test.pypi.org/pypi' || 'https://pypi.org/pypi' }}
  INDEX_URL: ${{ inputs.testpypi && 'https://test.pypi.org/simple/' || '' }}
  MOVING_TAG: ${{ inputs.testpypi && 'staging' || 'latest' }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' || inputs.testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      package_version: ${{ steps.check.outputs.package_version }}
      build_date: ${{ steps.check.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are versioned with pyfedappwrap: skip everything when this version is already published.
      - name: Check whether this version needs images
        id: check
        env:
          FORCE: ${{ inputs.force }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          version="${INPUT_VERSION:-$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')}"
          {
            echo "version=$version"
            echo "package_version=${INPUT_PACKAGE_VERSION:-$version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          # X.Y.Z.dev is a moving tag, always the newest develop build
          case "$version" in *.dev) FORCE=true ;; esac
          # A new image in the chain is built for the current version as well
          missing=""
          for image in $IMAGES; do
            docker buildx imagetools inspect "$REGISTRY/$image:$version" > /dev/null 2>&1 || missing="$missing $image"
          done
          if [ "$FORCE" != "true" ] && [ -z "$missing" ]; then
            echo "Images for pyfedappwrap $version already exist, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building, missing:${missing:- none (forced)}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The images install pyfedappwrap from (Test)PyPI (published by publish.yml), so the release has to be available first.
      - name: Wait for the release on (Test)PyPI
        if: steps.check.outputs.build == 'true'
        env:
          VERSION: ${{ steps.check.outputs.package_version }}
        run: |
          for attempt in $(seq 1 20); do
            curl -sf "$PYPI_JSON/FL-Net-Python-Tool-API/$VERSION/json" > /dev/null && exit 0
            echo "pyfedappwrap $VERSION is not on $PYPI_JSON yet ($attempt/20)"
            sleep 30
          done
          echo "::error::pyfedappwrap $VERSION is not published on $PYPI_JSON"
          exit 1

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Native runners per architecture: apk/R installs under QEMU emulation are many times slower.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images build on each other, so the whole chain is built locally on the default docker
      # builder (later images use the earlier ones as BASE_IMAGE) and pushed once at the end.
      - name: Build image chain
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          ARCH: ${{ matrix.arch }}
        run: |
          ctx="$RUNNER_TEMP/docker-context"
          mkdir -p "$ctx"
          cp docker/docker-entrypoint.sh "$ctx/"
          cp -r code-transformer-runtime "$ctx/"

          build() { # <dockerfile> <image> [build args...]
            local file="$1" image="$2"
            shift 2
            echo "::group::$image"
            docker build \
              --build-arg PYFEDAPPWRAP_VERSION="$PACKAGE_VERSION" \
              --build-arg PYFEDAPPWRAP_INDEX_URL="$INDEX_URL" \
              --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
              --build-arg FEDDB_IMAGE_BUILD_DATE="$BUILD_DATE" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$PACKAGE_VERSION" \
              "$@" \
              -f "$file" \
              -t "$REGISTRY/$image:$VERSION-$ARCH" \
              "$ctx"
            echo "::endgroup::"
          }

          build docker/Dockerfile.base-chainguard           base-python            --build-arg PYFEDAPPWRAP_WITH_DEPS=0
          build docker/Dockerfile.base-chainguard           base-python-dep        --build-arg PYFEDAPPWRAP_WITH_DEPS=1
          build docker/Dockerfile.base-r-chainguard         base-r                 --build-arg BASE_IMAGE="$REGISTRY/base-python:$VERSION-$ARCH"
          build docker/Dockerfile.base-r-chainguard         base-r-dep             --build-arg BASE_IMAGE="$REGISTRY/base-python-dep:$VERSION-$ARCH"
          build docker/Dockerfile.base-r-cluster-chainguard base-r-biocmanager     --build-arg BASE_IMAGE="$REGISTRY/base-r:$VERSION-$ARCH"
          build docker/Dockerfile.base-r-cluster-chainguard base-r-dep-biocmanager --build-arg BASE_IMAGE="$REGISTRY/base-r-dep:$VERSION-$ARCH"
          build docker/Dockerfile.code-transformer-runtime  code-transformer-runtime --build-arg BASE_IMAGE="$REGISTRY/base-python-dep:$VERSION-$ARCH"

      - name: Push images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          for image in $IMAGES; do
            docker push "$REGISTRY/$image:$VERSION-$ARCH"
          done

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for image in $IMAGES; do
            docker buildx imagetools create \
              -t "$REGISTRY/$image:$VERSION" \
              -t "$REGISTRY/$image:$MOVING_TAG" \
              "$REGISTRY/$image:$VERSION-amd64" \
              "$REGISTRY/$image:$VERSION-arm64"
          done

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: [prepare, manifest]
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: read
      security-events: write
