name: Code transformer runtime (branch)

# Publishes the code transformer runtime from feature/dynamic_transformation with the SDK of the pushed commit,
# before that SDK is released; releases from main build it in docker.yml on the released SDK.
on:
  push:
    branches: [feature/dynamic_transformation]
    paths:
      - "code-transformer-runtime/**"
      - "pyfedappwrap/**"
      - "pyproject.toml"
      - "docker/Dockerfile.code-transformer-runtime"
      - ".github/workflows/runtime-branch.yml"
  workflow_dispatch:

concurrency:
  group: runtime-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fedlearnnet/python-tool-api/code-transformer-runtime

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # A runtime that fails its own checks is not published
      - name: Test the runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          cd code-transformer-runtime && python -m pytest .

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --build-arg SDK_REF="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            -f docker/Dockerfile.code-transformer-runtime \
            --push .
