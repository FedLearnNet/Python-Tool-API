name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "pyfedappwrap/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pyfedappwrap/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ --junitxml=test-results/junit.xml

      # Summary on the run page and failed tests as annotations. annotate_only needs no check run,
      # so it also works with the read-only token of pull requests from forks.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          report_paths: "test-results/junit.xml"
          annotate_only: true
          require_tests: true
          include_time_in_summary: true

  build:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
